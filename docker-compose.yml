version: '3.8'
services:
  codeserver:
    container_name: codeserver
    build:
      context: ./codeserver/python
      dockerfile: Dockerfile
    ports:
      - 8443:8443
    restart: unless-stopped
    environment:
      SUDO_PASSWORD: ${SUDO_PASSWORD:-password}
    volumes:
      - ./code:/config/workspace
      - ./codeserver/config:/config